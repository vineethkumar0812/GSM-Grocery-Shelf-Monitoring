{% extends 'base.html' %}

{% block content %}
<div class="container text-center mt-5">
    <h2>Empty Shelf Detection</h2>
    <div class="video-container">
        <img src="{% url 'video_feed' %}" alt="Video Stream" class="img-fluid" id="videoStream">
    </div>
    <p class="mt-3">Point your camera at the shelf, and the detection system will alert if empty spaces are found.</p>
</div>

<style>
    .video-container {
        max-width: 100%;
        overflow: hidden;
    }

    #videoStream {
        width: 100%;
        height: auto;
        object-fit: cover;
        /* Ensures the video covers the container without distortion */
    }
</style>
{% endblock %}
