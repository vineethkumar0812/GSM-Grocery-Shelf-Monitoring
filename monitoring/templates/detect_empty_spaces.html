{% extends 'base.html' %}

{% load static %}

{% block content %}
<div class="container">
    <h2 class="text-center">Empty Space Detection</h2>

    <!-- Image upload area -->
    <div class="mb-2 text-center">
        <input type="file" id="imageUpload" class="form-control" accept="image/*" onchange="previewImage()" />
    </div>

    <!-- Detect button -->
    <div class="text-center mb-2">
        <button class="btn btn-primary" onclick="detectEmptySpaces()">Detect</button>
    </div>

    <!-- Image preview area -->
    <div class="row">
        <div class="col-md-6">
            <h5>Original Image</h5>
            <img id="originalImage" class="img-fluid rounded" src="" alt="Original Image"
                style="display:none; height: 360px;">
        </div>
        <div class="col-md-6">
            <h5>Detected Image</h5>
            <img id="detectedImage" class="img-fluid rounded" src="" alt="Detected Image"
                style="display:none; height: 360px;">
        </div>
    </div>

    <!-- JavaScript for image preview and detection -->
    <script>
        let uploadedFile = null;

        // Preview the uploaded image
        function previewImage() {
            const fileInput = document.getElementById('imageUpload');
            uploadedFile = fileInput.files[0];

            const reader = new FileReader();
            reader.onload = function (e) {
                document.getElementById('originalImage').src = e.target.result;
                document.getElementById('originalImage').style.display = 'block';
            };
            reader.readAsDataURL(uploadedFile);
        }

        // Detect empty spaces in the uploaded image
        function detectEmptySpaces() {
            if (!uploadedFile) {
                alert("Please upload an image first.");
                return;
            }

            const formData = new FormData();
            formData.append('image', uploadedFile);

            fetch("{% url 'detect_empty_spaces' %}", {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}',
                }
            })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('detectedImage').src = 'data:image/png;base64,' + data.detected_image;
                    document.getElementById('detectedImage').style.display = 'block';
                })
                .catch(error => console.error('Error:', error));
        }
    </script>
</div>
{% endblock %}
